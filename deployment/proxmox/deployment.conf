# Ideate Proxmox LXC inventory. Secrets stay in the repo-root .env (gitignored).

PROXMOX_HOST=192.168.29.231
PROXMOX_USER=root

TAILNET_DNS=tailce422e.ts.net
CONTAINER_USER=raja
CONTAINER_PASSWORD="${CONTAINER_PASSWORD:-}"

# Reuse MoneyTree profile templates already on this host (do not rebuild).
API_CLONE_TEMPLATE=moneytree-lxc-base
API_CLONE_TEMPLATE_VMID=9001
APP_CLONE_TEMPLATE=moneytree-lxc-frontend-base
APP_CLONE_TEMPLATE_VMID=9002
REQUIRE_CLONE_TEMPLATE=1

LXC_ROOTFS_STORAGE=local-storage
LXC_ROOTFS_GB=16
LXC_BOOT_DISK_GB=16

# API LXC
API_VMID=7201
API_CONTAINER_NAME=ideate-api
API_HOST=ideate-api.tailce422e.ts.net
API_CORES=2
API_MEMORY_MB=2048
API_PORT=8080
API_USER=ideate-api
API_DIR=/opt/ideate-api

# App LXC (Angular PWA + nginx)
APP_VMID=7202
APP_CONTAINER_NAME=ideate
APP_HOST=ideate.tailce422e.ts.net
APP_CORES=1
APP_MEMORY_MB=512
APP_DIR=/opt/ideate-app
# Alias used by copied Tailscale helpers when deriving TAILNET_DNS.
FRONTEND_HOST=ideate.tailce422e.ts.net
FRONTEND_VMID=7202

IDEATE_CORS_ORIGINS=http://localhost:4200,http://127.0.0.1:4200,https://ideate.tailce422e.ts.net
IDEATE_AUTH_ENABLED=false

# Optional: SSH public key appended to CONTAINER_USER authorized_keys.
SSH_PUBLIC_KEY=
