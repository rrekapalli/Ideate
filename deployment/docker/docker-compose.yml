services:
  postgres:
    image: pgvector/pgvector:pg16
    # Optional local AGE+pgvector image: docker compose build postgres-age
    # Default app database is MoneyTree's pg18 (AGE 1.8 + pgvector) via PgBouncer.
    # Use this compose only for an isolated local Postgres.
    container_name: ideate-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ideate}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ideate}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ideate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ideate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ideate_pg:
